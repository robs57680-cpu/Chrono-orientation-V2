<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chrono course d'orientation</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f2;--card:#fff;--tx:#1b2a21;--mut:#6a7a70;--ac:#1f7a4d;--acx:#fff;--st:#c0392b;--bd:#dde3da}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111813;--card:#1c2620;--tx:#e8efe9;--mut:#93a39a;--ac:#3fb37a;--acx:#0b1510;--st:#e5675a;--bd:#2c3833}}
:root[data-theme="dark"]{--bg:#111813;--card:#1c2620;--tx:#e8efe9;--mut:#93a39a;--ac:#3fb37a;--acx:#0b1510;--st:#e5675a;--bd:#2c3833}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0}
h1{font-size:20px;margin:0 0 10px}
nav{display:flex;gap:6px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{padding:14px 16px 40px;max-width:720px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card.run{border-color:var(--ac);border-width:2px}
.nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.tm{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;min-height:30px}
.tm.mut{color:var(--mut)}
button.b{padding:12px;border:0;border-radius:10px;font:inherit;font-weight:700;background:var(--ac);color:var(--acx)}
button.b.stop{background:var(--st);color:#fff}
button.b.sec{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:600}
.x{background:none;border:0;color:var(--mut);font-size:13px;padding:2px;text-align:left}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:200px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hint{color:var(--mut);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>🧭 Chrono course d'orientation</h1>
<nav><button data-v="chrono" class="on">Chrono</button><button data-v="res">Résultats</button><button data-v="els">Élèves</button></nav>
</header>
<main>
<section id="chrono"></section>
<section id="res" hidden></section>
<section id="els" hidden></section>
</main>
<script>
const KEY='co-chrono-v1';
let S={students:[],runs:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function fmt(ms){const t=Math.max(0,Math.floor(ms/100));return Math.floor(t/600)+':'+pad(Math.floor(t%600/10))+'.'+t%10}
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==='on')e.onclick=attrs[k];else e.setAttribute(k,attrs[k])}kids.flat().forEach(c=>e.append(c));return e}
const live=id=>S.runs.find(r=>r.sid===id&&r.end==null);
const fin=id=>S.runs.filter(r=>r.sid===id&&r.end!=null);
const dur=r=>r.end-r.start;
let view='chrono';

function renderChrono(){
  const el=$('#chrono');el.replaceChildren();
  if(!S.students.length){el.append(h('p',{class:'hint'},'Ajoute d\u2019abord les prénoms dans l\u2019onglet « Élèves ».'));return}
  const g=h('div',{class:'grid'});
  S.students.forEach(s=>{
    const r=live(s.id),d=fin(s.id),last=d[d.length-1];
    const t=h('div',{class:'tm'+(r||last?'':' mut')},r?'0:00.0':last?fmt(dur(last)):'–');
    if(r)t.dataset.start=r.start;
    const btn=r?h('button',{class:'b stop',on:()=>{r.end=Date.now();save();renderChrono()}},'Arrêter')
               :h('button',{class:'b',on:()=>{S.runs.push({sid:s.id,start:Date.now(),end:null});save();renderChrono()}},last?'Nouveau départ':'Départ');
    const kids=[h('div',{class:'nm'},s.name),t,h('div',{class:'hint'},d.length?d.length+(d.length>1?' essais':' essai'):''),btn];
    if(r)kids.push(h('button',{class:'x',on:()=>{S.runs=S.runs.filter(x=>x!==r);save();renderChrono()}},'Annuler ce départ'));
    g.append(h('div',{class:'card'+(r?' run':'')},kids));
  });
  el.append(g);
}

let sortBy='eleve';
function renderRes(){
  const el=$('#res');el.replaceChildren();
  const all=S.runs.filter(r=>r.end!=null).map(r=>({r,s:S.students.find(x=>x.id===r.sid)})).filter(x=>x.s).sort((a,b)=>a.r.start-b.r.start);
  if(!all.length){el.append(h('p',{class:'hint'},'Aucun temps enregistré pour le moment.'));return}
  const cnt={};all.forEach(x=>{cnt[x.s.id]=(cnt[x.s.id]||0)+1;x.n=cnt[x.s.id]});
  const rows=[...all];
  if(sortBy==='eleve')rows.sort((a,b)=>a.s.name.localeCompare(b.s.name,'fr')||a.r.start-b.r.start);
  else if(sortBy==='temps')rows.sort((a,b)=>dur(a.r)-dur(b.r));
  const seg=h('div',{class:'row'});
  [['eleve','Par élève'],['temps','Par temps'],['date','Chronologique']].forEach(([k,l])=>seg.append(h('button',{class:'b'+(sortBy===k?'':' sec'),on:()=>{sortBy=k;renderRes()}},l)));
  const tb=h('tbody');
  rows.forEach(x=>{
    const d=new Date(x.r.start);
    const del=h('button',{class:'x'},'✕');let armed=false;
    del.onclick=()=>{if(!armed){armed=true;del.textContent='Sûr ?';setTimeout(()=>{armed=false;del.textContent='✕'},3000);return}S.runs=S.runs.filter(y=>y!==x.r);save();renderRes()};
    tb.append(h('tr',{},h('td',{},x.s.name),h('td',{},'n°'+x.n),h('td',{},pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())),h('td',{},h('b',{},fmt(dur(x.r)))),h('td',{},del)));
  });
  el.append(seg,h('div',{class:'scroll'},h('table',{},h('thead',{},h('tr',{},h('th',{},'Élève'),h('th',{},'Essai'),h('th',{},'Départ'),h('th',{},'Temps'),h('th',{},''))),tb)));
  const msg=h('p',{class:'hint'},'');
  const ex=h('button',{class:'b',on:async()=>{
    const lines=['Prénom;Essai;Date;Heure de départ;Temps (s);Temps'];
    all.forEach(x=>{const d=new Date(x.r.start);
      lines.push([x.s.name,x.n,d.toLocaleDateString('fr-FR'),pad(d.getHours())+':'+pad(d.getMinutes()),(dur(x.r)/1000).toFixed(1).replace('.',','),fmt(dur(x.r))].join(';'))});
    try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'temps-course-orientation.csv',data:'\ufeff'+lines.join('\n')});msg.textContent='Fichier enregistré.'}
    catch(e){if(e&&e.code==='declined')return;try{await navigator.clipboard.writeText(lines.join('\n'));msg.textContent='Copié dans le presse-papiers (à coller dans un tableur).'}catch(_){msg.textContent='Export indisponible sur cet appareil.'}}
  }},'Exporter en CSV');
  el.append(h('div',{class:'row'},ex),msg);
}

function renderEls(){
  const el=$('#els');el.replaceChildren();
  const ta=h('textarea',{placeholder:'Un prénom par ligne'});ta.value=S.students.map(s=>s.name).join('\n');
  const msg=h('p',{class:'hint'},'');
  const ok=h('button',{class:'b',on:()=>{
    const names=[...new Set(ta.value.split('\n').map(x=>x.trim()).filter(Boolean))];
    const old=S.students;
    S.students=names.map(n=>old.find(o=>o.name===n)||{id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n});
    const ids=new Set(S.students.map(s=>s.id));S.runs=S.runs.filter(r=>ids.has(r.sid));
    save();msg.textContent=names.length+' élèves enregistrés.';
  }},'Enregistrer la liste');
  let armed=false;
  const clr=h('button',{class:'b sec',on:()=>{
    if(!armed){armed=true;clr.textContent='Confirmer : tout effacer ?';setTimeout(()=>{armed=false;clr.textContent='Effacer tous les temps'},4000);return}
    S.runs=[];save();armed=false;clr.textContent='Effacer tous les temps';msg.textContent='Temps effacés.';
  }},'Effacer tous les temps');
  el.append(h('p',{class:'hint'},'Un prénom par ligne. Les temps déjà enregistrés sont conservés pour les prénoms qui restent.'),ta,h('div',{class:'row'},ok,clr),msg,
    h('p',{class:'hint'},'Les données sont stockées sur cet appareil : utilise toujours le même téléphone ou la même tablette, et exporte en CSV pour garder une copie.'));
}

function show(v){
  view=v;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['chrono','res','els'].forEach(i=>$('#'+i).hidden=i!==v);
  ({chrono:renderChrono,res:renderRes,els:renderEls})[v]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
setInterval(()=>{if(view==='chrono')document.querySelectorAll('[data-start]').forEach(e=>e.textContent=fmt(Date.now()-e.dataset.start))},100);
show(S.students.length?'chrono':'els');
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
